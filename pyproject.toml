[tool.pytest.ini_options]
addopts = "-ra --cov=app --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 90

[tool.coverage.paths]
engine = ["app/engine"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PL", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
"app/models.py" = ["PLR2004"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app"]
exclude = ["app/static"]

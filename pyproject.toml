[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 95

[tool.coverage.paths]
engine = ["app/engine"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "C90",
    "SIM",
    "PL",
    "RUF",
    "S",
    "ARG",
    "PTH",
    "PERF",
    "RET",
    "PIE",
    "PT",
    "DTZ",
    "BLE",
    "ISC",
    "TID",
    "SLF",
]

[tool.ruff.lint.mccabe]
max-complexity = 7

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "Depends",
    "Query",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG", "SLF001", "PLR0913", "PT011", "PT018", "BLE001"]
"app/routers/**" = ["ARG001"]
"app/main.py" = ["ARG001"]
"app/engine/indoor_guidance.py" = ["RUF001"]
"scripts/verify/verify_lighthouse.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app"]
exclude = ["app/static"]

[tool.mutmut]
source_paths = [
    "app/engine/",
    "app/services/guard_numbers.py",
    "app/services/guard_safety.py",
    "app/services/guard_wording.py",
]
pytest_add_cli_args_test_selection = ["tests/unit/"]

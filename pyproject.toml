[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 95

[tool.coverage.paths]
engine = ["app/engine"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "C90",
    "SIM",
    "PL",
    "RUF",
    "S",
    "ARG",
    "PTH",
    "PERF",
    "RET",
    "PIE",
    "PT",
    "DTZ",
    "BLE",
    "ISC",
    "TID",
    "SLF",
]

[tool.ruff.lint.mccabe]
max-complexity = 7

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "Depends",
    "Query",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG", "SLF001", "PLR0913", "PT011", "PT018", "BLE001"]
"scripts/**" = [
    "S101",
    "PLR2004",
    "S603",
    "S607",
    "S108",
    "PLR0915",
    "PLR0912",
    "S310",
    "S606",
    "S110",
    "S112",
    "E501",
    "ARG",
    "BLE001",
    "T201",
    "PTH",
    "C901",  # Standalone CLI runner scripts with environment branching
]
"app/models.py" = ["PLR2004"]
"app/routers/**" = ["ARG001"]
"app/main.py" = ["ARG001"]
"app/engine/indoor_guidance.py" = ["RUF001"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app"]
exclude = ["app/static"]
